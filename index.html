<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Receptionist Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23667eea;stop-opacity:1' /%3E%3Cstop offset='100%25' style='stop-color:%23764ba2;stop-opacity:1' /%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='48' fill='url(%23grad)'/%3E%3Cpath d='M50 25 L35 40 L65 40 Z' fill='%23fff'/%3E%3Cpath d='M30 40 L30 48 Q30 50 32 50 L68 50 Q70 50 70 48 L70 40 Z' fill='%23fff'/%3E%3Crect x='48' y='48' width='4' height='8' fill='%23fff' rx='1'/%3E%3Cpath d='M40 56 Q40 58 42 58 L58 58 Q60 58 60 56 L60 54 L40 54 Z' fill='%23fff'/%3E%3Ccircle cx='50' cy='64' r='3' fill='%23fbbf24'/%3E%3Ctext x='50' y='82' font-family='Arial' font-size='28' fill='%23fff' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
            height: 90vh;
            max-height: 700px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
            position: relative;
        }

        .chat-header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .connection-status {
            position: absolute;
            top: 15px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }

        .status-indicator.disconnected {
            background: #ef4444;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #f8fafc;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .message.bot .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .message-content {
            max-width: 70%;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.bot .message-bubble {
            background: white;
            color: #1e293b;
            border: 1px solid #e2e8f0;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        /* --- MARKDOWN STYLES START --- */
        .message-bubble p {
            margin-bottom: 8px;
        }
        .message-bubble p:last-child {
            margin-bottom: 0;
        }
        .message-bubble strong {
            font-weight: 700;
        }
        .message-bubble em {
            font-style: italic;
        }
        .message-bubble ul, .message-bubble ol {
            margin-left: 20px;
            margin-bottom: 8px;
        }
        .message-bubble li {
            margin-bottom: 4px;
        }
        .message-bubble code {
            font-family: 'Consolas', 'Monaco', monospace;
            background: rgba(0, 0, 0, 0.1);
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .message.user .message-bubble code {
            background: rgba(255, 255, 255, 0.2);
        }
        .message-bubble pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 8px;
        }
        .message-bubble pre code {
            background: transparent;
            color: inherit;
            padding: 0;
        }
        .message-bubble a {
            color: #4f46e5;
            text-decoration: underline;
        }
        .message.user .message-bubble a {
            color: white;
        }
        /* --- MARKDOWN STYLES END --- */

        /* Mute button controls */

        .header-controls {
            position: absolute;
            top: 15px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .mute-button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transition: all 0.2s;
        }

        .mute-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .mute-button svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Update connection-status to remove absolute positioning 
        since it will now be inside header-controls */
        .connection-status {
            position: static; /* Changed from absolute */
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .message-time {
            font-size: 11px;
            color: #94a3b8;
            padding: 0 8px;
        }

        .message.user .message-time {
            text-align: right;
        }

        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e2e8f0;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .chat-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .chat-input:disabled {
            background: #f1f5f9;
            cursor: not-allowed;
        }

        .send-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 20px;
        }

        .send-button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .send-button:active:not(:disabled) {
            transform: scale(0.95);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .chat-container {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }

            .message-content {
                max-width: 80%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
<div class="chat-header">
    <div class="header-controls">
        <button class="mute-button" id="muteButton" title="Toggle Mute">
            <svg id="soundIcon" viewBox="0 0 24 24">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <svg id="muteIcon" viewBox="0 0 24 24" style="display: none;">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
        </button>
        
        <div class="connection-status">
            <div class="status-indicator disconnected" id="statusIndicator"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </div>
    
    <h1>🏨 AI Receptionist</h1>
    <p>Ask me anything about your stay!</p>
</div>
        <div class="chat-messages" id="chatMessages">
            </div>

        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <input 
                    type="text" 
                    class="chat-input" 
                    id="messageInput" 
                    placeholder="Type your message..."
                    disabled
                    autocomplete="off"
                >
                <button class="send-button" id="sendButton" disabled>
                    ➤
                </button>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');

        let isMuted = false;
        let currentAudio = null; // Track current audio to stop it if needed
        const muteButton = document.getElementById('muteButton');
        const soundIcon = document.getElementById('soundIcon');
        const muteIcon = document.getElementById('muteIcon');


        // Configure Marked to treat line breaks as <br>
        marked.use({
            breaks: true,
            gfm: true
        });

        // Get WebSocket URL based on current location
        function getWebSocketURL() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host;
            return `ws://localhost:8000/receptionist`;
        }

        // Format timestamp
        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // Add message to chat with MARKDOWN Support
        function addMessage(type, message, timestamp) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = type === 'bot' ? '🤖' : '👤';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            
            // --- MARKDOWN RENDERING LOGIC ---
            // 1. Parse markdown to HTML
            const rawHtml = marked.parse(message);
            // 2. Sanitize HTML to prevent XSS attacks
            const cleanHtml = DOMPurify.sanitize(rawHtml);
            // 3. Set innerHTML
            bubble.innerHTML = cleanHtml;
            
            const time = document.createElement('div');
            time.className = 'message-time';
            time.textContent = formatTime(timestamp) || formatTime(new Date().toISOString());
            
            content.appendChild(bubble);
            content.appendChild(time);
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Update connection status
        function updateStatus(connected) {
            if (connected) {
                statusIndicator.classList.remove('disconnected');
                statusText.textContent = 'Connected';
                messageInput.disabled = false;
                sendButton.disabled = false;
            } else {
                statusIndicator.classList.add('disconnected');
                statusText.textContent = 'Disconnected';
                messageInput.disabled = true;
                sendButton.disabled = true;
            }
        }

        // Connect to WebSocket
        function connect() {
            const wsUrl = getWebSocketURL();
            console.log('Connecting to:', wsUrl);
            
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('WebSocket connected');
                updateStatus(true);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                addMessage(data.type, data.message, data.timestamp);

                if (data.audio && data.type === 'bot') {
                    playAudioResponse(data.audio);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                updateStatus(false);
                // Attempt to reconnect after 3 seconds
                setTimeout(connect, 3000);
            };
        }

        // Send message
        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || !ws || ws.readyState !== WebSocket.OPEN) return;
            
            const timestamp = new Date().toISOString();

            // Add user message to chat
            addMessage('user', message, timestamp);

            // Send to server in JSON format
            const messageData = {
                type: 'user',
                message: message,
                timestamp: timestamp,
            };
            ws.send(JSON.stringify(messageData));

            // Clear input
            messageInput.value = '';
            messageInput.focus();
        }

        function playAudioResponse(base64Audio) {
            // 1. If muted, do nothing
            if (isMuted) return;

            try {
                // 2. Stop any currently playing audio so they don't overlap
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }

                const audioSource = "data:audio/mp3;base64," + base64Audio;
                currentAudio = new Audio(audioSource);
                
                // 3. Clean up variable when audio finishes naturally
                currentAudio.onended = () => {
                    currentAudio = null;
                };

                currentAudio.play().catch(e => {
                    console.error("Audio autoplay blocked:", e);
                });
            } catch (error) {
                console.error("Error decoding audio:", error);
            }
        }

        // Event listeners
        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        muteButton.addEventListener('click', () => {
            isMuted = !isMuted;
            
            if (isMuted) {
                soundIcon.style.display = 'none';
                muteIcon.style.display = 'block';
                // If audio is currently speaking, shut it up immediately
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }
            } else {
                soundIcon.style.display = 'block';
                muteIcon.style.display = 'none';
            }
        });

        // Connect on page load
        connect();
    </script>
</body>
</html>
